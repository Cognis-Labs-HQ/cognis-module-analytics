<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Cognis Analytics</title>
  <desc id="desc">An ascending analytics graph connected by glowing data points</desc>
  <defs>
    <linearGradient id="bg" x1="12" y1="8" x2="118" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102a43"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="line" x1="25" y1="91" x2="104" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <path d="M24 99.5h81M24.5 99V26" fill="none" stroke="#94a3b8" stroke-opacity=".28" stroke-width="2" stroke-linecap="round"/>
  <path d="M27 87 47 70l17 9 18-28 20-17" fill="none" stroke="url(#line)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <g fill="#f8fafc" stroke="#22d3ee" stroke-width="3">
    <circle cx="27" cy="87" r="5"/><circle cx="47" cy="70" r="5"/><circle cx="64" cy="79" r="5"/><circle cx="82" cy="51" r="5"/><circle cx="102" cy="34" r="5"/>
  </g>
</svg>
